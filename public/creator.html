<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Go LIVE - NVME.live</title>
<link rel="icon" href="/img/icon-192.png">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:Inter,system-ui;overflow:hidden;height:100dvh;width:100vw}
#cam{position:fixed;inset:0;width:100vw;height:100dvh;object-fit:cover;object-position:center center;background:#000;z-index:0;transform:scaleX(-1)}
#cam.env{transform:scaleX(1)}
.overlay{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;pointer-events:none}
.overlay *{pointer-events:auto}
.top{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.icon{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;color:#fff;border:none;cursor:pointer;text-decoration:none}
.pill{padding:6px 12px;border-radius:20px;background:rgba(0,0,0,.55);font-size:.75rem}
.reward{margin:6px 10px;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.15);font-size:.7rem;display:flex;justify-content:space-between;gap:8px}
.tools{position:absolute;right:8px;top:70px;bottom:140px;display:flex;flex-direction:column;gap:14px;align-items:center}
.t{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.t .i{width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;font-size:16px;border:1px solid rgba(255,255,255,.1)}
.t span{font-size:.55rem;text-shadow:0 1px 2px #000}
.bottom{margin-top:auto;padding:8px 12px 10px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent)}
.go{width:100%;height:48px;border-radius:24px;border:none;background:#fe2c55;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.go.live{background:#0f0;color:#000}
.mini{display:flex;gap:10px;justify-content:center;font-size:.6rem;opacity:.7;margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:20px;justify-content:center;margin-top:8px;font-size:.7rem;font-weight:700;opacity:.6}
.tabs .a{opacity:1;border-bottom:2px solid #fff}
</style>
</head>
<body>
<video id="cam" autoplay playsinline muted></video>
<div class="overlay">
  <div class="top"><a href="/app.html" class="icon">✕</a><div class="pill">♫ Add sound</div><div style="display:flex;gap:6px"><button class="icon" onclick="flip()">↻</button><a href="/app.html" class="icon">✕</a></div></div>
  <div class="reward" id="rw"><span>Scaled LIVE Rewards: complete missions +$0.01</span><button onclick="rw.remove()" style="background:none;border:none;color:#fff;cursor:pointer">✕</button></div>
  <div class="tools">
    <div class="t" onclick="flip()"><div class="i">⇄</div><span>Flip</span></div>
    <div class="t"><div class="i">✨</div><span>Beautify</span></div>
    <div class="t"><div class="i">🎨</div><span>Effects</span></div>
    <div class="t"><div class="i">⚙</div><span>Settings</span></div>
    <div class="t"><div class="i">👥</div><span>Hangout</span></div>
    <div class="t"><div class="i">📋</div><span>Boards</span></div>
    <div class="t"><div class="i">💬</div><span>Service+</span></div>
    <div class="t"><div class="i">❤</div><span>Fan Club</span></div>
    <div class="t"><div class="i">👁</div><span>Interact</span></div>
    <div class="t"><div class="i">↗</div><span>Share</span></div>
  </div>
  <div class="bottom">
    <div style="display:flex;justify-content:space-between;font-size:.68rem;margin-bottom:8px"><span style="background:rgba(0,0,0,.5);padding:4px 10px;border-radius:12px">👑 Build Your Digital System</span><span>◉ LIVE goal</span></div>
    <button class="go" id="go">Go LIVE</button>
    <div class="mini"><span>🎤 Voice</span><span>📷 Camera</span><span>🎮 Gaming</span><span>💻 Studio</span></div>
    <div class="tabs"><span class="a">LIVE</span><span>POST</span><span>CREATE</span></div>
  </div>
</div>
<script>
const cam=document.getElementById('cam'); let facing='user',stream=null;
async function start(){ if(stream) stream.getTracks().forEach(t=>t.stop()); try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:1280},height:{ideal:720}},audio:true}); cam.srcObject=stream; await cam.play(); }catch(e){ alert('Allow camera: click lock > Allow'); } }
function flip(){ facing=facing==='user'?'environment':'user'; cam.classList.toggle('env',facing==='environment'); start(); }
document.getElementById('go').onclick=function(){ this.classList.toggle('live'); this.textContent=this.classList.contains('live')?'END LIVE':'Go LIVE'; };
window.addEventListener('load',start);
</script>
</body>
</html>
