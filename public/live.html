<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nvme.live — LIVE</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    * { margin:0; padding:0; box-sizing:border-box; }
    /* Hard guard: nothing may push the page past the viewport */
    html, body { overflow-x:hidden; max-width:100vw; }
    /* clip clips without creating a scroll container, so position:sticky keeps working */
    @supports (overflow-x: clip) {
      html, body { overflow-x:clip; }
    }
    body { background:#07070d; color:#fff; font-family:'Segoe UI',system-ui,sans-serif; height:100vh; overflow:hidden; }

    /* ── Layout ───────────────────────────────────────────── */
    #app { display:flex; height:100vh; }
    #stream-area { flex:1; position:relative; background:#0a0a12; display:flex; align-items:center; justify-content:center; overflow:hidden; }
    #sidebar { width:320px; display:flex; flex-direction:column; background:#0f0f1a; border-left:1px solid #1a1a2e; }

    /* ── Stream area ──────────────────────────────────────── */
    #stream-video { width:100%; height:100%; object-fit:cover; }
    #stream-placeholder { text-align:center; color:#444; }
    #stream-placeholder .live-badge { display:inline-flex; align-items:center; gap:8px; background:linear-gradient(135deg,#e91e8c,#c2185b); color:#fff; font-weight:800; font-size:1.1rem; padding:8px 20px; border-radius:30px; margin-bottom:16px; animation:pulseBadge 2s ease-in-out infinite; }
    @keyframes pulseBadge { 0%,100%{box-shadow:0 0 0 0 rgba(233,30,140,0.4)} 50%{box-shadow:0 0 0 12px rgba(233,30,140,0)} }
    #stream-placeholder .live-dot { width:10px; height:10px; background:#fff; border-radius:50%; animation:blink 1s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Gift overlay ─────────────────────────────────────── */
    #gift-overlay { position:absolute; inset:0; pointer-events:none; z-index:100; overflow:hidden; }
    .gift-anim { position:absolute; display:flex; flex-direction:column; align-items:center; animation-fill-mode:forwards; }

    /* Lv1 — Recruit: corner coin flip */
    .gift-recruit { bottom:80px; right:20px; animation:recruitAnim 2.5s ease-out forwards; font-size:2rem; }
    @keyframes recruitAnim {
      0%  { opacity:0; transform:scale(0) rotate(0deg); }
      20% { opacity:1; transform:scale(1.2) rotate(180deg); }
      80% { opacity:1; transform:scale(1) rotate(360deg); }
      100%{ opacity:0; transform:scale(0.5) translateY(-40px); }
    }

    /* Lv2 — Soldier: sword slash across screen */
    .gift-soldier { top:50%; left:-20%; transform:translateY(-50%); animation:soldierAnim 2s ease-in-out forwards; font-size:3.5rem; white-space:nowrap; filter:drop-shadow(0 0 12px #e91e8c); }
    @keyframes soldierAnim {
      0%  { opacity:0; left:-20%; transform:translateY(-50%) rotate(-15deg) scale(0.8); }
      25% { opacity:1; left:15%;  transform:translateY(-50%) rotate(-15deg) scale(1.5); }
      70% { opacity:1; left:65%;  transform:translateY(-50%) rotate(-15deg) scale(1.4); }
      100%{ opacity:0; left:115%; transform:translateY(-50%) rotate(-15deg) scale(0.8); }
    }

    /* Lv3 — Captain: fire from bottom */
    .gift-captain { bottom:-20%; left:50%; transform:translateX(-50%); animation:captainAnim 3s ease-out forwards; font-size:5rem; filter:drop-shadow(0 0 20px #ff6600); }
    @keyframes captainAnim {
      0%  { opacity:0; bottom:-20%; transform:translateX(-50%) scale(0.4); }
      20% { opacity:1; bottom:8%;  transform:translateX(-50%) scale(2); }
      60% { bottom:18%; transform:translateX(-50%) scale(1.6); }
      85% { opacity:1; }
      100%{ opacity:0; bottom:45%; transform:translateX(-50%) scale(0.9); }
    }

    /* Lv4 — Director: lightning strike */
    .gift-director { top:-5%; left:50%; transform:translateX(-50%); animation:directorAnim 2.5s ease-out forwards; font-size:6rem; filter:drop-shadow(0 0 30px #00d4ff); }
    @keyframes directorAnim {
      0%  { opacity:0; top:-5%; transform:translateX(-50%) scaleY(0.1); }
      15% { opacity:1; top:5%;  transform:translateX(-50%) scaleY(1.6) scaleX(0.7); }
      30% { top:10%;  transform:translateX(-50%) scale(1.4); }
      60% { opacity:1; top:15%; transform:translateX(-50%) scale(1.2); }
      100%{ opacity:0; top:10%; transform:translateX(-50%) scale(0.5); }
    }

    /* Lv5 — Commander: golden crown drop */
    .gift-commander { top:-15%; left:50%; transform:translateX(-50%); animation:commanderAnim 4s ease-out forwards; font-size:7rem; filter:drop-shadow(0 0 40px gold); }
    @keyframes commanderAnim {
      0%  { opacity:0; top:-15%; transform:translateX(-50%) scale(0.3) rotate(-10deg); }
      25% { opacity:1; top:20%;  transform:translateX(-50%) scale(1.6) rotate(5deg); }
      50% { top:28%;  transform:translateX(-50%) scale(1.4) rotate(-2deg); }
      80% { opacity:1; top:25%;  transform:translateX(-50%) scale(1.3) rotate(0deg); }
      100%{ opacity:0; top:15%; transform:translateX(-50%) scale(0.9); }
    }
    /* Confetti particle */
    .confetti-dot { position:absolute; width:8px; height:8px; border-radius:50%; pointer-events:none; }

    /* Lv6 — CxO Elite: diamond rain full-screen */
    .gift-cxo { position:absolute; inset:0; animation:cxoAnim 4s ease-in-out forwards;
      background:linear-gradient(135deg,rgba(0,212,255,0.12),rgba(100,0,180,0.12));
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:12px;
    }
    @keyframes cxoAnim { 0%{opacity:0} 10%{opacity:1} 80%{opacity:1} 100%{opacity:0} }
    .gift-cxo .cxo-title { font-size:2.8rem; font-weight:900; background:linear-gradient(90deg,#00d4ff,#a855f7,#00d4ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-size:200%; animation:shimmerCxo 1.5s linear infinite; letter-spacing:4px; }
    @keyframes shimmerCxo { 0%{background-position:0%} 100%{background-position:200%} }
    .gift-cxo .cxo-diamonds { font-size:2.5rem; animation:diamondPulse 0.4s ease-in-out infinite alternate; }
    @keyframes diamondPulse { from{letter-spacing:6px;filter:drop-shadow(0 0 8px #00d4ff)} to{letter-spacing:18px;filter:drop-shadow(0 0 24px #a855f7)} }
    .rain-diamond { position:absolute; pointer-events:none; font-size:1.5rem; animation:fallDown linear forwards; }
    @keyframes fallDown { 0%{transform:translateY(-60px) rotate(0deg);opacity:1} 100%{transform:translateY(110vh) rotate(360deg);opacity:0} }

    /* Lv7 — DIGITAL KING: full screen takeover */
    .gift-king { position:absolute; inset:0; background:rgba(0,0,0,0.96); animation:kingAnim 6s ease-in-out forwards;
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; z-index:200;
    }
    @keyframes kingAnim { 0%{opacity:0} 5%{opacity:1} 85%{opacity:1} 100%{opacity:0} }
    .gift-king .king-bg-glow { position:absolute; inset:0; background:radial-gradient(ellipse at center,rgba(255,215,0,0.15) 0%,transparent 70%); animation:kingGlow 1s ease-in-out infinite alternate; }
    @keyframes kingGlow { from{opacity:0.6} to{opacity:1} }
    .gift-king .king-emoji { font-size:8rem; animation:kingPulse 0.6s ease-in-out infinite alternate; position:relative; z-index:1; }
    @keyframes kingPulse { from{transform:scale(1);filter:drop-shadow(0 0 20px gold) drop-shadow(0 0 60px rgba(255,215,0,0.5))} to{transform:scale(1.08);filter:drop-shadow(0 0 50px gold) drop-shadow(0 0 120px rgba(255,215,0,0.7))} }
    .gift-king .king-title { font-size:3.2rem; font-weight:900; letter-spacing:6px; background:linear-gradient(90deg,#FFD700,#FFA500,#FFD700,#FFF8DC,#FFD700); -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shimmerGold 0.8s linear infinite; background-size:300%; position:relative; z-index:1; }
    @keyframes shimmerGold { 0%{background-position:0%} 100%{background-position:300%} }
    .gift-king .king-sender-name { font-size:1.6rem; font-weight:700; color:#FFD700; text-shadow:0 0 20px gold; position:relative; z-index:1; }
    .gift-king .king-sub { font-size:1rem; color:#aaa; position:relative; z-index:1; }
    .gift-king canvas { position:absolute; inset:0; z-index:0; }
    /* Camera shake */
    .shake { animation:cameraShake 0.08s steps(1) infinite; }
    @keyframes cameraShake {
      0%  { transform:translate(0,0) rotate(0deg); }
      16% { transform:translate(-4px,3px) rotate(-0.3deg); }
      33% { transform:translate(4px,-3px) rotate(0.3deg); }
      50% { transform:translate(-3px,4px) rotate(0deg); }
      66% { transform:translate(3px,-2px) rotate(-0.3deg); }
      83% { transform:translate(-2px,3px) rotate(0.3deg); }
      100%{ transform:translate(2px,-4px) rotate(0deg); }
    }

    /* ── Sender label ─────────────────────────────────────── */
    .gift-label { background:rgba(0,0,0,0.75); backdrop-filter:blur(4px); padding:5px 14px; border-radius:20px; font-size:0.82rem; margin-top:8px; white-space:nowrap; border:1px solid rgba(255,255,255,0.1); }

    /* ── Chat sidebar ─────────────────────────────────────── */
    #chat-header { padding:14px 16px; font-weight:700; font-size:0.95rem; border-bottom:1px solid #1a1a2e; display:flex; justify-content:space-between; align-items:center; background:#0d0d1a; }
    #viewer-count { background:linear-gradient(135deg,#e91e8c,#c2185b); color:#fff; border-radius:20px; padding:3px 11px; font-size:0.78rem; font-weight:700; }
    #chat-messages { flex:1; overflow-y:auto; overscroll-behavior:contain; padding:12px 10px; display:flex; flex-direction:column; gap:7px; }
    #chat-messages::-webkit-scrollbar { width:3px; }
    #chat-messages::-webkit-scrollbar-thumb { background:#2a2a3e; border-radius:4px; }
    .chat-msg { font-size:0.88rem; line-height:1.45; word-break:break-word; }
    .chat-msg .name { font-weight:700; margin-right:5px; }
    .chat-msg.gift-msg { background:linear-gradient(90deg,rgba(233,30,140,0.18),rgba(0,212,255,0.08),transparent); padding:7px 10px; border-radius:8px; border-left:3px solid #e91e8c; }
    .chat-msg.gift-msg .name { color:#e91e8c; }
    .chat-msg.regular .name { color:#00d4ff; }

    /* ── Gift picker ──────────────────────────────────────── */
    #gift-panel { border-top:1px solid #1a1a2e; padding:12px; background:#0d0d1a; }
    #gift-panel-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    #gift-panel h4 { font-size:0.78rem; color:#7a8499; text-transform:uppercase; letter-spacing:1.5px; }
    #balance-display { font-size:0.78rem; color:gold; font-weight:700; }
    #gift-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px; }
    .gift-btn { background:#13131f; border:1px solid #2a2a3e; border-radius:10px; padding:8px 3px; cursor:pointer; text-align:center; transition:all 0.18s; user-select:none; }
    .gift-btn:hover { border-color:#e91e8c; background:#1e0f18; transform:scale(1.06); }
    .gift-btn.selected { border-color:gold; background:#1e1800; box-shadow:0 0 8px rgba(255,215,0,0.3); }
    .gift-btn .g-emoji { font-size:1.45rem; display:block; }
    .gift-btn .g-name { font-size:0.6rem; color:#7a8499; margin-top:2px; display:block; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
    .gift-btn .g-cost { font-size:0.68rem; color:gold; font-weight:700; display:block; }
    #send-gift-btn { width:100%; background:linear-gradient(135deg,#e91e8c,#7c3aed); border:none; color:#fff; padding:10px; border-radius:8px; font-weight:700; cursor:pointer; font-size:0.92rem; transition:opacity 0.2s,transform 0.1s; letter-spacing:0.5px; }
    #send-gift-btn:hover { opacity:0.88; transform:scale(1.01); }
    #send-gift-btn:active { transform:scale(0.98); }
    #gift-err { font-size:0.75rem; color:#f87171; margin-top:5px; display:none; text-align:center; }

    /* ── Chat input ───────────────────────────────────────── */
    #chat-input-area { padding:10px; border-top:1px solid #1a1a2e; display:flex; gap:7px; background:#0d0d1a; }
    #chat-input { flex:1; background:#13131f; border:1px solid #2a2a3e; color:#fff; padding:8px 12px; border-radius:20px; font-size:0.88rem; outline:none; transition:border-color 0.2s; min-width:0; }
    #chat-input:focus { border-color:#e91e8c; }
    #chat-input::placeholder { color:#3a3a5e; }
    #chat-send { background:linear-gradient(135deg,#e91e8c,#c2185b); border:none; color:#fff; width:36px; height:36px; border-radius:50%; cursor:pointer; font-size:1rem; flex-shrink:0; transition:transform 0.1s; }
    #chat-send:hover { transform:scale(1.1); }

    /* Button rows / carousels scroll INSIDE their own strip only —
       horizontal swipes must never chain into page scroll or stretch the layout */
    .swipe-container, .swipe-carousel, .filter-carousel {
      overflow-x: auto;
      overflow-y: hidden;
      max-width: 100%;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: none;
    }
    .swipe-container::-webkit-scrollbar, .swipe-carousel::-webkit-scrollbar, .filter-carousel::-webkit-scrollbar { display:none; }

    /* ── Battle bar (TikTok-style PK) ─────────────────────── */
    #battle-bar { position:absolute; top:0; left:0; right:0; z-index:150; display:none; padding:10px 12px 14px; background:linear-gradient(180deg,rgba(7,7,13,.92),transparent); }
    #battle-bar.show { display:block; }
    .battle-top-row { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
    .battle-side { flex:1; min-width:0; display:flex; align-items:center; gap:6px; }
    .battle-side.right { flex-direction:row-reverse; text-align:right; }
    .battle-avatar { width:26px; height:26px; border-radius:50%; background:#2a2a3e; object-fit:cover; flex-shrink:0; border:1px solid rgba(255,255,255,.2); }
    .battle-name { font-size:.72rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .battle-timer { flex-shrink:0; background:rgba(0,0,0,.6); border:1px solid #e91e8c; color:#fff; font-weight:800; font-size:.75rem; padding:3px 9px; border-radius:12px; min-width:38px; text-align:center; }
    .battle-bars { display:flex; height:10px; border-radius:6px; overflow:hidden; background:#1a1a2e; }
    .battle-bar-fill { height:100%; transition:width .4s ease; }
    .battle-bar-fill.left { background:linear-gradient(90deg,#00d4ff,#0090ff); margin-left:auto; }
    .battle-bar-fill.right { background:linear-gradient(90deg,#ff0050,#e91e8c); }
    .battle-attack-row { display:flex; gap:8px; margin-top:8px; }
    .battle-attack-btn { flex:1; padding:8px; border-radius:8px; border:2px solid; font-size:.72rem; font-weight:800; background:rgba(0,0,0,.5); cursor:pointer; transition:transform .1s; }
    .battle-attack-btn.left { border-color:#00d4ff; color:#00d4ff; }
    .battle-attack-btn.right { border-color:#ff0050; color:#ff0050; }
    .battle-attack-btn.armed { background:currentColor; color:#000!important; transform:scale(1.03); }
    .battle-attack-btn:active { transform:scale(.96); }
    #battle-winner-banner { position:absolute; inset:0; z-index:250; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:rgba(0,0,0,.85); text-align:center; }
    #battle-winner-banner.show { display:flex; }
    #battle-winner-banner .bw-title { font-size:1.8rem; font-weight:900; background:linear-gradient(90deg,gold,#fff8dc,gold); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

    /* ── Leaderboard panel ────────────────────────────────── */
    #rank-btn { background:rgba(255,215,0,.15); border:1px solid rgba(255,215,0,.4); color:gold; border-radius:20px; padding:3px 10px; font-size:.78rem; font-weight:700; cursor:pointer; margin-left:6px; }
    #leaderboard-panel { position:fixed; top:0; right:0; bottom:0; width:280px; max-width:82vw; background:#0d0d1a; border-left:1px solid #1a1a2e; z-index:400; transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column; }
    #leaderboard-panel.open { transform:translateX(0); }
    #lb-header { padding:14px 16px; font-weight:800; font-size:.9rem; border-bottom:1px solid #1a1a2e; display:flex; justify-content:space-between; align-items:center; }
    #lb-close { cursor:pointer; color:#7a8499; font-size:1.1rem; }
    #lb-list { flex:1; overflow-y:auto; padding:8px 10px; }
    .lb-row { display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:8px; }
    .lb-row .lb-rank { width:22px; font-weight:900; font-size:.85rem; text-align:center; color:#7a8499; flex-shrink:0; }
    .lb-row:nth-child(1) .lb-rank { color:gold; }
    .lb-row:nth-child(2) .lb-rank { color:#c0c0c0; }
    .lb-row:nth-child(3) .lb-rank { color:#cd7f32; }
    .lb-row .lb-avatar { width:32px; height:32px; border-radius:50%; background:#2a2a3e; object-fit:cover; flex-shrink:0; }
    .lb-row .lb-name { flex:1; font-size:.82rem; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lb-row .lb-total { font-size:.78rem; color:gold; font-weight:700; flex-shrink:0; }
    .lb-empty { text-align:center; color:#555; font-size:.82rem; padding:30px 10px; }
    #leaderboard-backdrop { position:fixed; inset:0; z-index:399; background:rgba(0,0,0,.5); display:none; }
    #leaderboard-backdrop.open { display:block; }

    /* ── Combo badge ───────────────────────────────────────── */
    #combo-badge { position:absolute; bottom:100%; left:50%; transform:translateX(-50%) scale(0); margin-bottom:6px; background:linear-gradient(135deg,#ff0050,#e91e8c); color:#fff; font-weight:900; font-size:.85rem; padding:4px 12px; border-radius:14px; white-space:nowrap; transition:transform .15s cubic-bezier(.34,1.56,.64,1); pointer-events:none; }
    #combo-badge.show { transform:translateX(-50%) scale(1); }
    #send-gift-wrap { position:relative; }

    /* ── Responsive ───────────────────────────────────────── */
    @media(max-width:640px) {
      #sidebar { width:100%; position:fixed; bottom:calc(49px + env(safe-area-inset-bottom,0px)); left:0; right:0; height:auto; max-height:60vh; z-index:50; }
      #chat-messages { min-height:0; }
      #app { flex-direction:column; }
      #stream-area { height:55vh; }
    }

/* ── HUGE GIFT ANIMATIONS ─────────────────────────────────────────── */
.gift-overlay-anim {
  position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  display: flex; align-items: center; justify-content: center;
}
.gift-anim-small { animation: giftPop 0.6s ease-out; font-size: 3rem; }
.gift-anim-medium { animation: giftShake 0.8s ease-in-out; font-size: 6rem; filter: drop-shadow(0 0 20px gold); }
.gift-anim-large { 
  animation: giftTakeover 2s ease-in-out; 
  font-size: 10rem; 
  filter: drop-shadow(0 0 60px gold) drop-shadow(0 0 120px magenta);
}
.gift-anim-huge {
  animation: giftEpic 3s ease-in-out;
  font-size: 16rem;
  filter: drop-shadow(0 0 100px gold) drop-shadow(0 0 200px cyan);
  background: radial-gradient(circle, rgba(255,215,0,0.3), transparent 70%);
  border-radius: 50%; padding: 2rem;
}
@keyframes giftPop {
  0% { transform: scale(0) rotate(-20deg); opacity: 0; }
  50% { transform: scale(1.3) rotate(5deg); opacity: 1; }
  100% { transform: scale(1) rotate(0); opacity: 0; }
}
@keyframes giftShake {
  0%,100% { transform: translateX(0) scale(1); }
  20% { transform: translateX(-20px) scale(1.1) rotate(-5deg); }
  40% { transform: translateX(20px) scale(1.1) rotate(5deg); }
  60% { transform: translateX(-10px) scale(1.05); }
  80% { transform: translateX(10px) scale(1.05); }
}
@keyframes giftTakeover {
  0% { transform: scale(0) translateY(100vh); opacity: 0; }
  30% { transform: scale(1.2) translateY(0); opacity: 1; }
  70% { transform: scale(1) translateY(0); opacity: 1; }
  100% { transform: scale(0.5) translateY(-50vh); opacity: 0; }
}
@keyframes giftEpic {
  0% { transform: scale(0); opacity: 0; filter: hue-rotate(0deg); }
  25% { transform: scale(1.5); opacity: 1; filter: hue-rotate(90deg); }
  50% { transform: scale(1.2); opacity: 1; filter: hue-rotate(180deg); }
  75% { transform: scale(1.3); opacity: 1; filter: hue-rotate(270deg); }
  100% { transform: scale(0); opacity: 0; filter: hue-rotate(360deg); }
}

/* ── Mobile bottom navigation ─────────────────────────────── */
.botnav{position:fixed;bottom:0;left:0;right:0;height:calc(49px + env(safe-area-inset-bottom,0px));padding:0 4px env(safe-area-inset-bottom,0px);background:rgba(0,0,0,.94);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.08);display:flex;align-items:stretch;z-index:200}
.bitem{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:rgba(255,255,255,.55);text-decoration:none;-webkit-tap-highlight-color:transparent}
.bitem.on{color:#fff}
.bitem .ic{font-size:1.35rem;line-height:1;height:24px;display:flex;align-items:center}
.bitem .lb{font-size:10px;font-weight:600;letter-spacing:.02em}
.bplus{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;margin-top:-10px}
.bplus-in{width:48px;height:30px;border-radius:9px;background:linear-gradient(90deg,#00f2ea 0 50%,#ff0050 50% 100%);color:#000;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:900;line-height:1;box-shadow:0 2px 0 #fff}
</style>

  <meta name="theme-color" content="#e91e8c">
</head>
<body>
<!-- NVME Mobile Back Bar -->
<div style="position:fixed;top:0;left:0;right:0;height:52px;background:rgba(7,7,13,0.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.06);z-index:9999;display:flex;align-items:center;padding:0 1rem;gap:0.75rem">
  <a href="/app.html" style="width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:center;font-size:1.2rem;color:#fff;text-decoration:none;flex-shrink:0">&#8592;</a>
  <span style="font-weight:700;font-size:1rem;color:#fff">🔴 Live Stream</span>
  <a href="/app.html" style="margin-left:auto;display:flex;align-items:center;gap:6px;text-decoration:none"><img src="/img/icon-192.png" alt="NVME" style="width:28px;height:28px;border-radius:7px" onerror="this.style.display='none'"></a>
</div>
<div style="height:52px"></div>
<div id="app">
  <!-- ── Stream Area ── -->
  <div id="stream-area">
    <div id="stream-placeholder">
      <div class="live-badge"><span class="live-dot"></span> LIVE</div>
      <div style="font-size:0.95rem;color:#555">Stream loading…</div>
    </div>
    <video id="stream-video" style="display:none" autoplay muted playsinline></video>

    <!-- ⚔️ Battle bar (hidden until a battle is created for this stream) -->
    <div id="battle-bar">
      <div class="battle-top-row">
        <div class="battle-side left">
          <img class="battle-avatar" id="battle-left-avatar" src="/img/icon-192.png" alt="">
          <span class="battle-name" id="battle-left-name">—</span>
        </div>
        <div class="battle-timer" id="battle-timer-display">--</div>
        <div class="battle-side right">
          <img class="battle-avatar" id="battle-right-avatar" src="/img/icon-192.png" alt="">
          <span class="battle-name" id="battle-right-name">—</span>
        </div>
      </div>
      <div class="battle-bars">
        <div class="battle-bar-fill left" id="battle-fill-left" style="width:50%"></div>
        <div class="battle-bar-fill right" id="battle-fill-right" style="width:50%"></div>
      </div>
      <div class="battle-attack-row">
        <button class="battle-attack-btn left" id="battle-attack-left" onclick="armAttack('left')">⚔️ Boost Left</button>
        <button class="battle-attack-btn right" id="battle-attack-right" onclick="armAttack('right')">⚔️ Boost Right</button>
      </div>
    </div>

    <div id="battle-winner-banner">
      <div style="font-size:3rem">🏆</div>
      <div class="bw-title" id="bw-title">BATTLE OVER</div>
      <div id="bw-sub" style="color:#aaa;font-size:.9rem"></div>
    </div>

    <div id="gift-overlay"></div>
  </div>

  <!-- ── Sidebar ── -->
  <div id="sidebar">
    <div id="chat-header">
      <span>🔴 LIVE CHAT</span>
      <div>
        <span id="viewer-count">👁 0</span>
        <button id="rank-btn" onclick="openLeaderboard()">🏆 Rank</button>
      </div>
    </div>
    <div id="chat-messages"></div>

    <!-- Gift Picker -->
    <div id="gift-panel">
      <div id="gift-panel-header">
        <h4>🔱 ORBAT Gifts</h4>
        <span id="balance-display">🪙 —</span>
      </div>
      <div id="gift-grid"></div>
      <div id="send-gift-wrap">
        <div id="combo-badge">x1</div>
        <button id="send-gift-btn">Send Gift 🎁</button>
      </div>
      <div id="gift-err"></div>
    </div>

    <!-- Chat Input -->
    <div id="chat-input-area">
      <input id="chat-input" placeholder="Say something..." maxlength="200">
      <button id="chat-send">➤</button>
    </div>
  </div>
</div>

<script>
/* ── Config ─────────────────────────────────────────────────── */
const TOKEN    = localStorage.getItem('nvme_token');
const STREAM_ID = new URLSearchParams(location.search).get('id');

// Load stream metadata on mount
async function loadStreamInfo() {
  if (!STREAM_ID) return;
  try {
    const r = await fetch(window.location.origin + '/api/streams/' + STREAM_ID);
    if (r.ok) {
      const data = await r.json();
      const stream = data.stream || data;
      document.title = (stream?.title || 'Live') + ' — nvme.live';
    }
  } catch(e) { console.warn('loadStreamInfo', e); }
}
loadStreamInfo();

/* ── Wallet balance ────────────────────────────────────────────
   Populates #balance-display and keeps it in sync after every
   gift send (the panel showed "🪙 —" forever before this). ── */
async function refreshBalance() {
  if (!TOKEN) return;
  try {
    const r = await fetch(window.location.origin + '/api/wallet/balance', {
      headers: { Authorization: 'Bearer ' + TOKEN }
    });
    if (!r.ok) return;
    const d = await r.json();
    document.getElementById('balance-display').textContent = `🪙 ${Math.floor(d.balance).toLocaleString()}`;
  } catch(e) { console.warn('refreshBalance', e); }
}
refreshBalance();

/* ── ORBAT Gift Tier Definitions ──────────────────────────────── */
const GIFTS = [
  { name:'Recruit',      emoji:'🪙',  cost:10,    level:1 },
  { name:'Soldier',      emoji:'⚔️',  cost:50,    level:2 },
  { name:'Captain',      emoji:'🔥',  cost:200,   level:3 },
  { name:'Director',     emoji:'⚡',  cost:500,   level:4 },
  { name:'Commander',    emoji:'👑',  cost:1000,  level:5 },
  { name:'CxO Elite',    emoji:'💎',  cost:5000,  level:6 },
  { name:'DIGITAL KING', emoji:'🔱',  cost:10000, level:7 },
];

/* ── Socket ──────────────────────────────────────────────────── */
const socket = io({ auth: { token: TOKEN } });
let selectedGift = null;

/* ── Build gift picker grid ──────────────────────────────────── */
const grid = document.getElementById('gift-grid');
GIFTS.forEach(g => {
  const btn = document.createElement('div');
  btn.className = 'gift-btn';
  btn.innerHTML = `<span class="g-emoji">${g.emoji}</span><span class="g-name">${g.name}</span><span class="g-cost">${g.cost}🪙</span>`;
  btn.onclick = () => {
    document.querySelectorAll('.gift-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedGift = g;
    document.getElementById('gift-err').style.display = 'none';
  };
  grid.appendChild(btn);
});

/* ── Send gift (real credits) ─────────────────────────────────
   Hits POST /api/gifts/send — the endpoint that actually deducts
   balance_credits and writes a gift_transactions row (what the
   leaderboard and battle attacks both read from). The old
   socket-only 'send_gift_by_name' path never charged anyone and
   never showed up in the leaderboard, so it's dropped here. ── */
async function sendGiftReal(gift, quantity) {
  if (!STREAM_ID) { showGiftErr('No stream ID in URL'); return; }
  if (!TOKEN)     { showGiftErr('You must be logged in'); return; }
  try {
    const r = await fetch(window.location.origin + '/api/gifts/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify({ streamId: STREAM_ID, giftName: gift.name, quantity })
    });
    const d = await r.json();
    if (!r.ok || d.error) { showGiftErr(d.error || 'Gift failed'); return; }
    refreshBalance();
    if (leaderboardOpen) loadLeaderboard();
  } catch(e) { showGiftErr('Network error'); }
}
function showGiftErr(msg) {
  const el = document.getElementById('gift-err');
  el.textContent = msg; el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 3000);
}

/* ── Combo/streak tap ──────────────────────────────────────────
   Tapping Send repeatedly (within COMBO_WINDOW_MS of the last
   tap) stacks a x2/x3/x4… multiplier instead of firing a
   separate charge per tap. The batched send fires once the
   taps stop, same feel as TikTok's hold-to-combo gifting. ── */
const COMBO_WINDOW_MS = 1400;
let comboGift = null, comboCount = 0, comboTimer = null;
const comboBadge = document.getElementById('combo-badge');

function tapSendGift() {
  if (!selectedGift) { showGiftErr('Select a gift first'); return; }

  // A different gift than the one currently combo-ing: flush the old one first.
  if (comboGift && comboGift.name !== selectedGift.name) flushCombo();

  comboGift = selectedGift;
  comboCount += 1;
  comboBadge.textContent = 'x' + comboCount;
  comboBadge.classList.add('show');
  // Re-trigger the pop animation on every tap
  comboBadge.style.animation = 'none';
  void comboBadge.offsetWidth;
  comboBadge.style.animation = '';

  clearTimeout(comboTimer);
  comboTimer = setTimeout(flushCombo, COMBO_WINDOW_MS);
}
function flushCombo() {
  clearTimeout(comboTimer);
  if (!comboGift || comboCount === 0) return;
  const gift = comboGift, qty = comboCount;
  comboGift = null; comboCount = 0;
  comboBadge.classList.remove('show');
  sendGiftReal(gift, qty);
}
// Flush immediately if the tab is hidden/closed mid-combo so a tap isn't lost.
document.addEventListener('visibilitychange', () => { if (document.hidden) flushCombo(); });

document.getElementById('send-gift-btn').onclick = () => {
  // Mid-battle with a side armed: this tap is an attack, not a normal gift.
  if (activeBattle && armedSide) { tapAttack(); return; }
  tapSendGift();
};

/* ── Join stream ─────────────────────────────────────────────── */
if (STREAM_ID) socket.emit('join_stream', { streamId: STREAM_ID });

/* ── Socket events ───────────────────────────────────────────── */
socket.on('viewer_count', ({ count }) => {
  document.getElementById('viewer-count').textContent = `👁 ${count}`;
});
socket.on('gift_error', ({ error }) => showGiftErr(error));

/* ── Chat ────────────────────────────────────────────────────── */
function addChat(username, message, isGift = false) {
  const box = document.getElementById('chat-messages');
  const div = document.createElement('div');
  div.className = 'chat-msg ' + (isGift ? 'gift-msg' : 'regular');
  div.innerHTML = `<span class="name">${escHtml(username)}</span><span>${escHtml(message)}</span>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
  while (box.children.length > 120) box.removeChild(box.firstChild);
}
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
socket.on('live_chat', ({ username, message }) => addChat(username, message));

function sendChat() {
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg || !STREAM_ID) return;
  socket.emit('live_chat', { streamId: STREAM_ID, message: msg });
  input.value = '';
}
document.getElementById('chat-send').onclick = sendChat;
document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });

/* ════════════════════════════════════════════════════════════════
   GIFT ANIMATIONS
════════════════════════════════════════════════════════════════ */
const overlay    = document.getElementById('gift-overlay');
const streamArea = document.getElementById('stream-area');

function spawnGift({ senderName, gift }) {
  const level = gift.level || (GIFTS.findIndex(g => g.name === gift.name) + 1);
  const el    = document.createElement('div');
  el.className = 'gift-anim';
  const sn = escHtml(senderName);

  /* ── Level 1 — Recruit ────────────────────────────────── */
  if (level === 1) {
    el.classList.add('gift-recruit');
    el.innerHTML = `<span>${gift.emoji || '🪙'}</span><div class="gift-label">${sn} · Recruit</div>`;
    overlay.appendChild(el);
    setTimeout(() => el.remove(), 2700);

  /* ── Level 2 — Soldier ────────────────────────────────── */
  } else if (level === 2) {
    el.classList.add('gift-soldier');
    el.innerHTML = `<span style="margin-right:10px">${gift.emoji || '⚔️'}</span><span>${sn} — SOLDIER!</span>`;
    overlay.appendChild(el);
    setTimeout(() => el.remove(), 2200);

  /* ── Level 3 — Captain ────────────────────────────────── */
  } else if (level === 3) {
    el.classList.add('gift-captain');
    el.innerHTML = `<span>${gift.emoji || '🔥'}</span><div class="gift-label">${sn} — CAPTAIN!</div>`;
    overlay.appendChild(el);
    setTimeout(() => el.remove(), 3200);

  /* ── Level 4 — Director ───────────────────────────────── */
  } else if (level === 4) {
    el.classList.add('gift-director');
    el.innerHTML = `<span>${gift.emoji || '⚡'}</span><div class="gift-label">${sn} — DIRECTOR!</div>`;
    overlay.appendChild(el);
    setTimeout(() => el.remove(), 2700);

  /* ── Level 5 — Commander ──────────────────────────────── */
  } else if (level === 5) {
    el.classList.add('gift-commander');
    el.innerHTML = `<span>${gift.emoji || '👑'}</span><div class="gift-label">${sn} — COMMANDER!</div>`;
    // Confetti burst
    for (let i = 0; i < 35; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-dot';
      c.style.cssText = `
        left:${40 + Math.random() * 20}%;
        top:${25 + Math.random() * 20}%;
        background:hsl(${Math.random()*360},100%,60%);
        width:${5+Math.random()*7}px; height:${5+Math.random()*7}px;
        animation:recruitAnim ${0.8+Math.random()*1.6}s ease-out forwards ${Math.random()*0.5}s;
      `;
      overlay.appendChild(c);
      setTimeout(() => c.remove(), 3200);
    }
    overlay.appendChild(el);
    setTimeout(() => el.remove(), 4300);

  /* ── Level 6 — CxO Elite ──────────────────────────────── */
  } else if (level === 6) {
    el.classList.add('gift-cxo');
    el.innerHTML = `
      <div class="cxo-diamonds">💎💎💎💎💎</div>
      <div class="cxo-title">CxO ELITE</div>
      <div class="gift-label" style="font-size:0.95rem">${sn} sent <strong>5,000 credits!</strong></div>
    `;
    overlay.appendChild(el);
    // Diamond rain
    const rainInterval = setInterval(() => {
      const d = document.createElement('div');
      d.className = 'rain-diamond';
      d.textContent = '💎';
      d.style.cssText = `left:${Math.random()*100}%;top:-40px;font-size:${1+Math.random()*1.5}rem;animation-duration:${1.2+Math.random()*1.5}s;`;
      overlay.appendChild(d);
      setTimeout(() => d.remove(), 3000);
    }, 130);
    setTimeout(() => { clearInterval(rainInterval); el.remove(); }, 4200);

  /* ── Level 7 — DIGITAL KING ───────────────────────────── */
  } else if (level === 7) {
    el.classList.add('gift-king');
    const canvasId = 'king-canvas-' + Date.now();
    el.innerHTML = `
      <canvas id="${canvasId}"></canvas>
      <div class="king-bg-glow"></div>
      <div class="king-emoji">🔱</div>
      <div class="king-title">DIGITAL KING</div>
      <div class="king-sender-name">${sn}</div>
      <div class="king-sub">sent 10,000 credits 👑</div>
    `;
    overlay.appendChild(el);

    // Camera shake on stream area
    streamArea.classList.add('shake');

    // Particle canvas
    requestAnimationFrame(() => {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;
      canvas.width  = el.offsetWidth  || window.innerWidth;
      canvas.height = el.offsetHeight || window.innerHeight;
      const ctx = canvas.getContext('2d');
      const pts = Array.from({ length: 150 }, () => ({
        x:  Math.random() * canvas.width,
        y:  Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 5,
        vy: (Math.random() - 0.5) * 5,
        r:  1.5 + Math.random() * 3.5,
        c:  `hsl(${38 + Math.random() * 25},100%,${50+Math.random()*30}%)`
      }));
      let running = true;
      function drawFrame() {
        if (!running) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (const p of pts) {
          p.x += p.vx; p.y += p.vy;
          if (p.x < 0 || p.x > canvas.width)  p.vx *= -1;
          if (p.y < 0 || p.y > canvas.height) p.vy *= -1;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = p.c;
          ctx.fill();
        }
        requestAnimationFrame(drawFrame);
      }
      drawFrame();
      setTimeout(() => { running = false; }, 6000);
    });

    setTimeout(() => { streamArea.classList.remove('shake'); el.remove(); }, 6200);
  }

  // Always add a gift chat message
  const emoji = gift.emoji || '🎁';
  addChat(senderName, `${emoji} sent ${gift.name}!`, true);
}

/* ── Socket gift event ───────────────────────────────────────── */
function confettiEffect(n){
  if(!document.getElementById('confettiKF')){
    const st=document.createElement('style'); st.id='confettiKF';
    st.textContent='@keyframes confettiFall{to{transform:translateY(105vh) rotate(720deg);opacity:0}}';
    document.head.appendChild(st);
  }
  const colors=['#7c3aed','#ec4899','#fbbf24','#22d3ee','#ffffff'];
  for(let i=0;i<(n||80);i++){
    const el=document.createElement('div');
    el.style.cssText='position:fixed;z-index:9999;pointer-events:none;width:'+(6+Math.random()*6)+'px;height:'+(8+Math.random()*8)+'px;background:'+colors[i%colors.length]+';left:'+(Math.random()*100)+'vw;top:-12px;border-radius:2px;animation:confettiFall '+(1.2+Math.random()*1.8)+'s linear forwards';
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),3500);
  }
}
function handleIncomingGift(data) {
  confettiEffect(60);
  const giftName = data.gift?.name || data.giftName;
  const giftDef  = GIFTS.find(g => g.name === giftName) || GIFTS[0];
  spawnGift({
    senderName: data.senderName || data.fromUser || 'Anonymous',
    gift: { name: giftName, level: giftDef.level, emoji: data.emoji || giftDef.emoji }
  });
  if (leaderboardOpen) loadLeaderboard();
}
// 'new-gift' = real paid gifts (POST /api/gifts/send). 'gift_received' kept
// for any other source still emitting the legacy free-broadcast shape.
socket.on('new-gift', handleIncomingGift);
socket.on('gift_received', handleIncomingGift);

/* ════════════════════════════════════════════════════════════════
   🏆 TOP GIFTERS LEADERBOARD
════════════════════════════════════════════════════════════════ */
let leaderboardOpen = false;
async function loadLeaderboard() {
  if (!STREAM_ID) return;
  const list = document.getElementById('lb-list');
  try {
    const headers = TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {};
    const r = await fetch(window.location.origin + '/api/streams/' + STREAM_ID + '/gift-leaderboard', { headers });
    const d = await r.json();
    const rows = d.leaderboard || [];
    if (!rows.length) { list.innerHTML = '<div class="lb-empty">No gifts yet — be the first! 🎁</div>'; return; }
    list.innerHTML = rows.map((row, i) => `
      <div class="lb-row">
        <div class="lb-rank">${i === 0 ? '👑' : (i + 1)}</div>
        <img class="lb-avatar" src="${row.avatar_url || '/img/icon-192.png'}" alt="" onerror="this.src='/img/icon-192.png'">
        <div class="lb-name">${escHtml(row.username || 'Anonymous')}</div>
        <div class="lb-total">🪙 ${Math.floor(row.total).toLocaleString()}</div>
      </div>
    `).join('');
  } catch(e) { list.innerHTML = '<div class="lb-empty">Couldn\'t load leaderboard</div>'; }
}
function openLeaderboard() {
  leaderboardOpen = true;
  document.getElementById('leaderboard-panel').classList.add('open');
  document.getElementById('leaderboard-backdrop').classList.add('open');
  loadLeaderboard();
}
function closeLeaderboard() {
  leaderboardOpen = false;
  document.getElementById('leaderboard-panel').classList.remove('open');
  document.getElementById('leaderboard-backdrop').classList.remove('open');
}

/* ════════════════════════════════════════════════════════════════
   ⚔️ BATTLE (PK) BAR
   The backend already creates/starts/ends battles and logs gift-
   based attacks (see /api/streams/:id/battle, /api/battles/:id/*).
   It broadcasts those events to this stream's room, which this
   page already joins via 'join_stream' — this section is just the
   viewer-facing UI that was missing. ── */
let activeBattle = null;      // { id, left:{...}, right:{...} }
let armedSide = null;         // 'left' | 'right' | null
let battleTickInterval = null;

async function loadBattle(battleId) {
  try {
    const headers = TOKEN ? { Authorization: 'Bearer ' + TOKEN } : {};
    const r = await fetch(window.location.origin + '/api/battles/' + battleId, { headers });
    const d = await r.json();
    if (!d.ok && !d.battle) return;
    const battle = d.battle || d;
    const parts  = d.participants || [];
    const left  = parts.find(p => p.team === 'a') || parts[0] || null;
    const right = parts.find(p => p.team === 'b') || parts[1] || null;
    activeBattle = { id: battleId, battle, left, right };
    renderBattle();
  } catch(e) { console.warn('loadBattle', e); }
}

function renderBattle() {
  if (!activeBattle) return;
  const { battle, left, right } = activeBattle;
  document.getElementById('battle-bar').classList.add('show');

  document.getElementById('battle-left-name').textContent  = left?.username  || 'Waiting…';
  document.getElementById('battle-right-name').textContent = right?.username || 'Waiting…';
  if (left?.avatar_url)  document.getElementById('battle-left-avatar').src  = left.avatar_url;
  if (right?.avatar_url) document.getElementById('battle-right-avatar').src = right.avatar_url;

  const l = parseFloat(left?.gifts_received || 0);
  const r = parseFloat(right?.gifts_received || 0);
  const total = l + r;
  const leftPct = total > 0 ? (l / total) * 100 : 50;
  document.getElementById('battle-fill-left').style.width  = leftPct + '%';
  document.getElementById('battle-fill-right').style.width = (100 - leftPct) + '%';

  clearInterval(battleTickInterval);
  if (battle.status === 'active' && battle.started_at) {
    const durationMs = (battle.elimination_interval_seconds || 60) * 1000;
    const endsAt = new Date(battle.started_at).getTime() + durationMs;
    const tick = () => {
      const remaining = Math.max(0, Math.round((endsAt - Date.now()) / 1000));
      document.getElementById('battle-timer-display').textContent = remaining + 's';
      if (remaining <= 0) clearInterval(battleTickInterval);
    };
    tick();
    battleTickInterval = setInterval(tick, 1000);
  } else {
    document.getElementById('battle-timer-display').textContent = battle.status === 'waiting' ? '⏳' : '--';
  }
}

function armAttack(side) {
  if (!activeBattle) return;
  armedSide = (armedSide === side) ? null : side;
  document.getElementById('battle-attack-left').classList.toggle('armed', armedSide === 'left');
  document.getElementById('battle-attack-right').classList.toggle('armed', armedSide === 'right');
  if (armedSide && !selectedGift) showGiftErr('Pick a gift below to attack with');
}

async function tapAttack() {
  if (!activeBattle || !armedSide) return;
  if (!selectedGift) { showGiftErr('Pick a gift below to attack with'); return; }
  if (!TOKEN) { showGiftErr('You must be logged in'); return; }
  const target = armedSide === 'left' ? activeBattle.left : activeBattle.right;
  if (!target) { showGiftErr('That side has no fighter yet'); return; }
  try {
    const r = await fetch(window.location.origin + '/api/battles/' + activeBattle.id + '/attack', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + TOKEN },
      body: JSON.stringify({
        gift_type: selectedGift.name,
        cost: selectedGift.cost,
        damage: selectedGift.cost,
        stream_id: STREAM_ID,
        target_participant_id: target.id
      })
    });
    const d = await r.json();
    if (!d.ok) { showGiftErr(d.error || 'Attack failed'); return; }
    refreshBalance();
  } catch(e) { showGiftErr('Network error'); }
}

socket.on('battle_created', ({ battle }) => { if (battle) loadBattle(battle.id); });
socket.on('battle-started', ({ battleId }) => loadBattle(battleId));
socket.on('battle_started', ({ battleId }) => loadBattle(battleId));
socket.on('battle-attack', ({ battleId }) => { if (activeBattle && activeBattle.id === battleId) loadBattle(battleId); });
socket.on('battle-ended', (data) => showBattleWinner(data));
socket.on('battle_ended', (data) => showBattleWinner(data));

function showBattleWinner({ winnerId }) {
  if (!activeBattle) return;
  const winnerName = winnerId === activeBattle.left?.user_id ? activeBattle.left?.username
                    : winnerId === activeBattle.right?.user_id ? activeBattle.right?.username
                    : null;
  document.getElementById('bw-title').textContent = winnerName ? `${winnerName} WINS!` : 'BATTLE OVER';
  document.getElementById('bw-sub').textContent = 'Thanks for battling! 🎉';
  document.getElementById('battle-winner-banner').classList.add('show');
  confettiEffect(100);
  clearInterval(battleTickInterval);
  setTimeout(() => {
    document.getElementById('battle-winner-banner').classList.remove('show');
    document.getElementById('battle-bar').classList.remove('show');
    activeBattle = null; armedSide = null;
    document.querySelectorAll('.battle-attack-btn').forEach(b => b.classList.remove('armed'));
  }, 4500);
}
</script>
