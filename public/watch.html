<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050508" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Watch — NVME</title>
  <link rel="icon" href="/img/icon-192.png" />
  <link rel="apple-touch-icon" href="/img/icon-512.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { overflow: auto; height: auto; min-height: 100dvh; }
    .phone-shell { height: auto; min-height: 100dvh; }
    .topbar {
      display: flex; align-items: center; gap: 8px;
      padding: calc(8px + var(--safe-top)) 10px 8px;
      border-bottom: 1px solid var(--line);
    }
    .topbar a.back {
      width: 44px; height: 44px; display: grid; place-items: center;
      color: #fff; text-decoration: none; font-size: 22px;
    }
    .topbar strong { flex: 1; }
    .player {
      width: 100%; aspect-ratio: 16 / 9; background: #000; overflow: hidden;
    }
    #player { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    .meta-block { padding: 14px 16px 8px; }
    h1 { font-size: 1.05rem; margin: 0 0 8px; line-height: 1.3; }
    .creator { display: flex; align-items: center; gap: 10px; margin: 8px 0; }
    .creator img, .creator .av {
      width: 40px; height: 40px; border-radius: 50%; background: #222; object-fit: cover;
      display: grid; place-items: center; font-weight: 800;
    }
    .actions { display: flex; gap: 8px; margin: 10px 0; }
    .actions .btn { width: auto; padding: 0 16px; }
    #desc { color: var(--muted); font-size: 14px; line-height: 1.45; margin: 8px 0 0; }
    .related { padding: 8px 16px calc(16px + var(--safe-bottom)); }
    .related h2 { font-size: 15px; margin: 8px 0 10px; }
    .related a {
      display: flex; gap: 10px; color: #fff; text-decoration: none;
      padding: 8px 0; border-bottom: 1px solid var(--line); min-height: 72px; align-items: center;
    }
    .thumb {
      width: 128px; height: 72px; background: #1c1c28; border-radius: 8px; flex: none;
      display: grid; place-items: center; font-size: 11px; color: var(--muted); overflow: hidden;
    }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    @media (min-width: 860px) {
      .wrap {
        display: grid; grid-template-columns: 1fr 320px; gap: 20px;
        max-width: 1100px; margin: 0 auto; padding: 12px 16px calc(16px + var(--safe-bottom));
        width: 100%;
      }
      .related { padding: 0; }
      .phone-shell { width: 100%; max-width: 1100px; }
    }
  </style>
</head>
<body>
<div class="phone-shell">
  <div class="topbar">
    <a class="back" href="/app" aria-label="Back">‹</a>
    <strong>Watch</strong>
    <a href="/app" class="muted" style="text-decoration:none;font-size:13px;padding:0 8px">For You</a>
  </div>
  <div class="wrap">
    <section>
      <div class="player">
        <video id="player" controls playsinline webkit-playsinline></video>
      </div>
      <div class="meta-block">
        <h1 id="title">Loading…</h1>
        <div class="creator">
          <div class="av" id="av">N</div>
          <div>
            <div id="uname">@creator</div>
            <div class="muted" id="counts"></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn row" type="button" id="btnLike">❤️ Like</button>
          <button class="btn ghost row" type="button" id="btnShare">Share</button>
        </div>
        <p id="desc"></p>
      </div>
    </section>
    <aside class="related" id="related">
      <h2>Up next</h2>
    </aside>
  </div>
</div>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const vid = params.get('v');
  const player = document.getElementById('player');
  function token() { return localStorage.getItem('nvme_token'); }
  function authHeaders() {
    const t = token();
    return t ? { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' } : { 'Content-Type': 'application/json' };
  }
  function esc(s) {
    return String(s || '').replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  async function load() {
    if (vid) {
      const r = await fetch('/api/videos/' + encodeURIComponent(vid));
      const d = await r.json();
      const v = d.video || d;
      document.title = (v.title || 'Watch') + ' — NVME';
      document.getElementById('title').textContent = v.title || 'Untitled';
      document.getElementById('uname').textContent = '@' + (v.username || 'creator');
      document.getElementById('counts').textContent = (v.like_count || 0) + ' likes · ' + (v.view_count || v.views || 0) + ' views';
      document.getElementById('desc').textContent = v.description || '';
      document.getElementById('av').textContent = (v.username || 'n').charAt(0).toUpperCase();
      if (v.url) player.src = v.url;
      fetch('/api/videos/' + encodeURIComponent(vid) + '/view', { method: 'POST' }).catch(function () {});
    } else {
      document.getElementById('title').textContent = 'Pick a video';
    }
    const f = await fetch('/api/feed').then(function (r) { return r.json(); }).catch(function () { return { feed: [] }; });
    const box = document.getElementById('related');
    (f.feed || []).slice(0, 12).forEach(function (item) {
      if (vid && String(item.id) === String(vid)) return;
      const a = document.createElement('a');
      a.href = item.url ? ('/watch?v=' + encodeURIComponent(item.id)) : ('/live?id=' + encodeURIComponent(item.stream_id || String(item.id).replace(/^live_/, '')));
      const thumb = item.thumbnail
        ? '<div class="thumb"><img src="' + esc(item.thumbnail) + '" alt="" /></div>'
        : '<div class="thumb">' + (item.url ? 'VOD' : 'LIVE') + '</div>';
      a.innerHTML = thumb + '<div><div>' + esc(item.title || '') + '</div><div class="muted">@' + esc(item.username || '') + '</div></div>';
      box.appendChild(a);
    });
  }
  document.getElementById('btnLike').addEventListener('click', async function () {
    if (!vid) return;
    if (!token()) { location.href = '/app#me'; return; }
    await fetch('/api/videos/' + encodeURIComponent(vid) + '/like', { method: 'POST', headers: authHeaders() });
    this.textContent = '❤️ Liked';
  });
  document.getElementById('btnShare').addEventListener('click', async function () {
    const url = location.href;
    try {
      if (navigator.share) await navigator.share({ title: document.getElementById('title').textContent, url: url });
      else { await navigator.clipboard.writeText(url); this.textContent = 'Copied'; }
    } catch (e) {}
  });
  load().catch(function (e) {
    document.getElementById('title').textContent = 'Could not load';
    console.error(e);
  });
})();
</script>
</body>
</html>
